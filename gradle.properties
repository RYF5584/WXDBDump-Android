org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3 is officially tested up to compileSdk 35; 36 works but warns, so it is silenced.
android.suppressUnsupportedCompileSdk=36

# KSP2 incremental analysis throws an NPE on same-module Java sources, so it stays off.
ksp.incremental=false
ksp.incremental.transitive=false

