name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight build redundant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No SDK setup step: the ubuntu-latest image already ships ANDROID_HOME with
      # platforms;android-36 and build-tools;36.0.0, which is exactly what this project
      # targets. Adding android-actions/setup-android on top is not just redundant - it
      # fails on the current runner image and takes the whole job down before the build.

      # payload is pure Java, so its logic is testable without a device. Run the tests before
      # the APK: a build that compiles but fails its own checks is not worth uploading.
      # The failing assertions are echoed as error annotations. Workflow logs need a token to
      # download, annotations do not, so this is what makes a red build diagnosable.
      - name: Run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew :payload:test --no-daemon --stacktrace 2>&1 | tee test-output.log; then
            echo "::error::Unit tests failed. First failures:"
            grep -E "^[A-Za-z].*(FAILED|Error|Exception)|^e: |Caused by:" test-output.log \
              | head -8 | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: payload/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WXDB-Dump-Android-debug
          path: app/build/outputs/apk/debug/WXDB-Dump-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
